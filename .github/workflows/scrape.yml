name: Engagement Scraper

on:
  schedule:
    - cron: '20 */3 * * *'
  workflow_dispatch:

concurrency:
  group: binance-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run best-effort engagement scrape
        working-directory: automation
        env:
          API_URL: ${{ secrets.API_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SCRAPE_LIMIT: ${{ vars.SCRAPE_LIMIT || '50' }}
        run: node scrape.mjs

      - name: Debug - dump live analytics payload
        working-directory: automation
        env:
          API_URL: ${{ secrets.API_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          echo "=== engagement-series (7d) ==="
          curl -s -H "X-Bot-Token: $BOT_TOKEN" "$API_URL/api/stats/engagement-series?days=7" | tail -c 1200
          echo ""
          echo "=== account-performance (30d) ==="
          curl -s -H "X-Bot-Token: $BOT_TOKEN" "$API_URL/api/stats/account-performance?days=30" | head -c 1500